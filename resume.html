<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume – Mark John Ally Nantiza</title>
<meta name="description" content="Resume of Mark John Ally Nantiza, BS Information Technology.">
<meta name="theme-color" content="#fafafa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
document.documentElement.classList.add("js");
try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#18181b;--mute:#6b7280;--line:#e5e7eb;--accent:#2f5bea;--accent-ink:#fff;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#17171a;--ink:#f4f4f5;--mute:#a1a1aa;--line:#27272a;--accent:#7b9bff;--accent-ink:#0e0e10}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#17171a;--ink:#f4f4f5;--mute:#a1a1aa;--line:#27272a;--accent:#7b9bff;--accent-ink:#0e0e10}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
h1,h2,h3,p{margin:0}

/* toolbar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;height:60px;overflow-x:auto;scrollbar-width:none}
.bar-in::-webkit-scrollbar{display:none}
.back{color:var(--ink);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.back:hover{color:var(--accent)}
#nav{display:flex;gap:2px;margin:0 auto 0 14px}
#nav a{color:var(--mute);text-decoration:none;font:500 13px var(--mono);padding:6px 10px;border-radius:8px;white-space:nowrap;transition:color .2s}
#nav a:hover,#nav a.active{color:var(--ink)}
#nav a.active{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.ib{font:500 13px Inter,sans-serif;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .2s,border-color .2s,background .2s,color .2s}
.ib:hover{border-color:var(--ink);transform:translateY(-1px)}
.ib:active{transform:none}
.ib.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ib.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}

/* header */
.head{display:flex;gap:30px;align-items:center;padding:72px 0 44px}
.photo{position:relative;flex:none;width:132px;height:132px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:600 38px Inter,sans-serif;letter-spacing:-.04em;color:var(--mute);overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.status{display:inline-flex;align-items:center;gap:8px;font:400 12.5px var(--mono);color:var(--mute);margin-bottom:10px}
.status i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
h1{font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.1}
.role{font:400 14px var(--mono);color:var(--accent);margin:8px 0 14px}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:14.5px;color:var(--mute)}
.meta-row a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s,color .2s}
.meta-row a:hover{color:var(--accent);border-color:var(--accent)}
.mini{font:500 12px var(--mono);padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:color .2s,border-color .2s}
.mini:hover{color:var(--accent);border-color:var(--accent)}
[data-r]{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*100ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* sections */
.sec{margin-bottom:30px;transition:opacity .6s,transform .6s}
.js .sec:not(.in){opacity:0;transform:translateY(14px)}
summary{display:flex;align-items:baseline;gap:14px;cursor:pointer;list-style:none;padding:8px 0;border-bottom:1px solid var(--line);user-select:none}
summary::-webkit-details-marker{display:none}
summary:hover h2{color:var(--accent)}
summary .no{font:500 12px var(--mono);color:var(--accent)}
summary h2{flex:1;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:color .2s}
summary::after{content:"–";font:500 16px var(--mono);color:var(--mute)}
details:not([open]) summary::after{content:"+"}
.body{padding:18px 0 6px}
.pp{max-width:40em}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 24px;align-items:baseline;padding:14px 16px;margin:0 -16px;border-radius:12px;border:1px solid transparent;transition:border-color .25s,background .25s}
.row:hover{border-color:var(--line);background:var(--card)}
.row h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.row .meta{grid-column:1;color:var(--mute);font-size:14.5px}
.row time{grid-column:2;grid-row:1;font:500 12.5px var(--mono);color:var(--mute);white-space:nowrap}
.row .ib{grid-column:2;grid-row:1/3;align-self:center;padding:5px 11px}
.grp{display:grid;grid-template-columns:96px 1fr;gap:6px 16px;align-items:baseline;padding:8px 0}
.lbl{font:500 12px var(--mono);color:var(--mute);text-transform:lowercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);border-radius:6px;padding:2px 12px;font-size:14px;background:var(--card);transition:border-color .2s,color .2s,transform .2s;cursor:default}
.chips li:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

/* footer, toast, dialog */
.foot{padding:28px 0 56px;color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
kbd{font:500 11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
#lb{border:0;padding:0;background:transparent;max-width:min(94vw,1100px);width:100%}
#lb::backdrop{background:rgba(0,0,0,.75)}
#lb img{width:100%;height:auto;max-height:84vh;object-fit:contain;display:block;border-radius:10px;background:#fff}
#lb .ib{display:block;margin:12px auto 0;background:var(--ink);color:var(--bg);border-color:var(--ink)}

@media (max-width:720px){
#nav{display:none}.bar-in .back{margin-right:auto}
.head{flex-direction:column;align-items:flex-start;padding:44px 0 32px;gap:22px}
.grp{grid-template-columns:1fr}
.row{grid-template-columns:1fr}.row time,.row .ib{grid-column:1;grid-row:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}[data-r]{opacity:1!important}.js .sec:not(.in){opacity:1;transform:none}}

/* print: always a clean light document */
@media print{
@page{size:A4;margin:12mm}
:root{--bg:#fff!important;--card:#fff!important;--ink:#111!important;--mute:#555!important;--line:#ccc!important;--accent:#111!important}
body{font-size:11.5px;line-height:1.5}
.bar,.foot,.toast,#lb,.ib,.mini,summary::after{display:none!important}
.wrap{max-width:none;padding:0}
.head{padding:0 0 18px;gap:20px}.photo{width:90px;height:90px;border-radius:12px;font-size:26px}
[data-r],.js .sec:not(.in){opacity:1!important;transform:none!important;animation:none!important}
.sec{margin-bottom:14px;break-inside:avoid}
.row{padding:6px 0;margin:0;break-inside:avoid}.row:hover{background:none;border-color:transparent}
.grp{padding:3px 0}.chips li{background:none}
.status i{box-shadow:none}
a{color:inherit;text-decoration:none;border:0!important}
}
</style>
</head>
